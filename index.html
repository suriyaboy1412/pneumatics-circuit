<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pneumatic System by Suriya PTC</title>
<style>
:root{--ink:#0f172a;--bl:#1d4ed8;--bg:#f1f5f9;--pn:#fff;--bd:#cbd5e1;--ac:#0ea5e9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:Sarabun,"Noto Sans Thai",Tahoma,system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
#app{display:grid;height:100%;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);grid-template-rows:auto 1fr 150px;grid-template-columns:1fr 290px;grid-template-areas:"top top" "cv side" "pal side"}
#top{grid-area:top;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;background:#0b2a4a;color:#fff}
#top h1{font-size:16px;margin:0 8px 0 0;white-space:nowrap}
button,select,input{font:inherit}
.btn{border:1px solid #94a3b8;background:#fff;color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
.btn:hover{background:#e0f2fe}.btn.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn.red{background:#dc2626;color:#fff;border-color:#dc2626}
.seg{display:inline-flex}.seg .btn{border-radius:0}.seg .btn:first-child{border-radius:8px 0 0 8px}.seg .btn:last-child{border-radius:0 8px 8px 0}
#pal{grid-area:pal;background:var(--pn);border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:4px;overflow:hidden;padding:4px 8px;min-width:0}
.ptabs{display:flex;gap:4px;flex:none;overflow-x:auto}.ptabs .btn{white-space:nowrap;padding:4px 9px;font-size:12.5px}
.pwrap{display:flex;gap:4px;flex:1;min-height:0;align-items:stretch}.parr{flex:none;width:28px;padding:0;font-size:20px}
.pitems{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;flex:1;min-width:0;touch-action:pan-x;padding-bottom:2px}
.pi{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;width:108px;height:100%;border:2px solid var(--bd);border-radius:10px;padding:3px;cursor:pointer;background:#f8fafc;user-select:none}
.pi:hover{border-color:var(--ac);background:#e0f2fe}.pi.sel{border-color:#f59e0b;background:#fef3c7;box-shadow:0 0 0 2px #fcd34d}
.pi svg{width:100%;flex:1;min-height:0;background:#fff;border-radius:6px}
.pi span{font-size:11.5px;line-height:1.15;text-align:center;max-height:28px;overflow:hidden}
#armed{position:absolute;top:8px;left:8px;right:56px;z-index:5;display:none;align-items:center;gap:8px;background:#f59e0b;color:#1f2937;padding:6px 10px;border-radius:10px;font-size:13px;font-weight:600;pointer-events:auto}
#cv{grid-area:cv;position:relative;min-width:0;min-height:0}
#svg{width:100%;height:100%;display:block;touch-action:none;user-select:none}
#side{grid-area:side;background:var(--pn);border-left:1px solid var(--bd);overflow:auto;display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid var(--bd)}.tabs button{flex:1;border:0;background:#f1f5f9;padding:8px 2px;cursor:pointer;font-size:13px}
.tabs button.on{background:#fff;font-weight:700;border-bottom:3px solid var(--ac)}
.tp{padding:10px;font-size:13px;display:none}.tp.on{display:block}
.tp h4{margin:10px 0 4px;font-size:13px}.tp ul,.tp ol{margin:4px 0 4px 18px;padding:0}.tp li{margin-bottom:3px}
.fld{display:flex;align-items:center;gap:6px;margin:6px 0}.fld label{flex:0 0 96px;color:#475569}.fld select,.fld input[type=text]{flex:1;min-width:0}.fld input[type=range]{flex:1}
#bar{position:absolute;left:8px;bottom:8px;right:8px;pointer-events:none;display:flex;flex-direction:column;gap:4px}
.msg{align-self:flex-start;background:#0f172acc;color:#fff;border-radius:8px;padding:4px 10px;font-size:12.5px;max-width:100%}
.msg.w{background:#b91c1ccc}
#zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
#ghost{position:fixed;pointer-events:none;z-index:50;opacity:.85;display:none;background:#fff;border:2px solid var(--ac);border-radius:8px;padding:2px}
#ghost svg{width:90px;height:56px}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:60}
#modal>div{background:#fff;border-radius:12px;padding:16px;max-width:560px;max-height:85vh;overflow:auto;font-size:14px;margin:10px}
.toggleSide{display:none}.ls{display:none}body.test #zd,body.test #undoBox,body.test #tidy,body.test #chk,body.test #zp,body:not(.full) #fsrun{display:none}.btn:disabled{opacity:.45;cursor:default}
table.st{border-collapse:collapse;width:100%;font-size:12.5px}table.st td,table.st th{border-bottom:1px solid #e2e8f0;padding:3px 4px;text-align:left}
body.nopal #pal{display:none}
body.nopal #app{grid-template-rows:auto 1fr 0}
body.full #top,body.full #pal,body.full #side{display:none!important}
body.full #app{grid-template-columns:1fr!important;grid-template-rows:1fr!important;grid-template-areas:"cv"!important}
#zfs.on,#zp.on{background:var(--ac);color:#fff}
@media (max-width:820px),(max-height:520px){
 html,body{overscroll-behavior:none}
 #top{flex-wrap:nowrap;overflow-x:auto;padding:4px 6px;gap:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
 #top::-webkit-scrollbar{display:none}
 #top h1,#top .lb,.lf{display:none}.ls{display:inline}
 #top>*{flex:none}.btn{padding:6px 10px;min-height:36px}#ex{max-width:150px}
 .toggleSide{display:inline-block}
 #side{position:fixed;z-index:40;transition:transform .2s;box-shadow:0 0 20px #0005}#side.open{transform:none}
 #zoom .btn{padding:4px 9px;min-height:34px}
}
@media (max-width:820px) and (min-height:521px){
 #app{grid-template-columns:1fr;grid-template-rows:auto 1fr 138px;grid-template-areas:"top" "cv" "pal"}
 .parr{display:none}
 #side{left:0;right:0;bottom:0;height:52vh;transform:translateY(100%);border-top:2px solid var(--ac)}
}
@media (max-height:520px){
 #zoom{flex-direction:row;flex-wrap:wrap;justify-content:flex-end;max-width:210px}
 body.nopal #app{grid-template-columns:0 1fr;grid-template-rows:auto 1fr}
 #app{grid-template-columns:132px 1fr;grid-template-rows:auto 1fr;grid-template-areas:"top top" "pal cv"}
 #pal{border-top:0;border-right:1px solid var(--bd);padding:4px;overflow:auto}
 .ptabs{flex-wrap:wrap;overflow:visible}.ptabs .btn{padding:4px 7px;min-height:32px}.ptabs .tx{display:none}
 .pwrap{flex-direction:column;flex:none}.parr{display:none}
 .pitems{flex-direction:column;overflow-x:hidden;overflow-y:visible;touch-action:pan-y;flex:none}
 .pi{width:100%;height:86px}
 #side{top:52px;right:0;bottom:0;width:min(340px,55vw);transform:translateX(100%);border-left:2px solid var(--ac)}
 #armed{font-size:12px;padding:4px 8px}
}
#login{position:fixed;inset:0;z-index:2000;background:linear-gradient(160deg,#0b2545,#13315c 60%,#1d4e89);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#login.hide{display:none}
#lcard{background:#fff;border-radius:16px;padding:22px 22px 18px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.4);font-family:inherit}
#lcard h2{margin:0 0 2px;font-size:20px;color:#0b2545}#lcard .sub{color:#475569;font-size:13px;margin-bottom:14px;line-height:1.5}
#lcard label{display:block;font-size:13px;font-weight:600;color:#334155;margin:10px 0 4px}
#lcard input[type=text],#lcard input[type=tel]{width:100%;box-sizing:border-box;padding:11px 12px;font-size:16px;border:1.5px solid #94a3b8;border-radius:10px;font-family:inherit}
#lcard input:focus{outline:none;border-color:#0284c7}
#lcard .fixed{padding:10px 12px;background:#f1f5f9;border-radius:10px;font-size:14px;color:#0f172a}
.lcls{display:flex;flex-direction:column;gap:8px}
#lcard .lcls label{display:flex;align-items:center;gap:10px;margin:0;padding:11px 12px;border:1.5px solid #cbd5e1;border-radius:10px;font-weight:500;font-size:15px;cursor:pointer}
#lcard .lcls input{width:20px;height:20px;margin:0}#lcard .lcls label.on{border-color:#0284c7;background:#e0f2fe}
#lerr{color:#dc2626;font-size:13px;min-height:1.3em;margin:8px 0 0}
#lgo{width:100%;margin-top:6px;padding:13px;font-size:16px;font-weight:700;border:0;border-radius:10px;background:#0284c7;color:#fff;cursor:pointer;font-family:inherit}
#who{position:absolute;top:8px;left:8px;z-index:4;display:none;background:rgba(255,255,255,.93);border:1px solid #cbd5e1;border-radius:10px;padding:6px 10px;font-size:12px;line-height:1.45;color:#0f172a;max-width:min(300px,calc(100% - 70px));box-shadow:0 2px 8px rgba(0,0,0,.12)}
body.test #who.on{display:block}
#who{pointer-events:none;opacity:.62;transition:opacity .15s}#who:hover{opacity:.62}
#who .wh,#who button{pointer-events:auto}
#who .wh{display:inline-block;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;background:#0284c7;color:#fff;border-radius:6px;padding:1px 8px;font-size:11px;margin-bottom:3px}
#who.drag .wh{cursor:grabbing}#who.drag{opacity:.4}
#who b{font-size:13px}#who button{margin-top:3px;font-size:11px;padding:2px 8px;border:1px solid #94a3b8;background:#fff;border-radius:6px;cursor:pointer}

 <h2>⚙ Pneumatic System by Suriya PTC</h2>
 <div class="sub">เข้าสู่ระบบเพื่อใช้งานห้องทดลอง<br>วิชา งานนิวเมติกส์และไฮดรอลิกส์เบื้องต้น 20100-1007</div>

</form></div>
<script>
const NS='http://www.w3.org/2000/svg',R=Math.round;
const $=id=>document.getElementById(id);
function S(p,t,a,txt){const e=document.createElementNS(NS,t);if(a)for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;if(p)p.appendChild(e);return e}
let ui='test',comps=[],wires=[],seq=0,view='s',running=true,sel=null,netsDirty=true,netOf={},leak=false;
const PL={},held=new Set(),cnt={};

const DEFS={
 supply:{pre:'P',props:()=>({on:true,bar:6}),bb:()=>[90,92]},
 frl:{pre:'FRL',props:()=>({set:6}),bb:()=>[120,84]},
 tee:{pre:'T',props:()=>({}),bb:()=>[60,50],merge:1},

 throttle:{pre:'GRU',props:()=>({set:0.3,flip:false,rot:true}),bb:c=>c.props.rot?[76,100]:[100,76]},

 and:{pre:'AND',props:()=>({}),bb:()=>[80,64]},

 cross:{pre:'X',props:()=>({}),bb:()=>[60,60],merge:1},
 plug:{pre:'PL',props:()=>({}),bb:()=>[30,30],merge:1},

 check:{pre:'CV',props:()=>({flip:false}),bb:()=>[80,40]},
 qex:{pre:'QE',props:()=>({}),bb:()=>[80,64]},

 const o={},add=(n,x,y,dx,dy,l)=>o[n]={x,y,dx,dy,l:l==null?n:l};
 switch(c.type){
 case'supply':add('out',90,40,1,0,'');break;

 case'tee':add('a',0,15,-1,0,'');add('b',60,15,1,0,'');add('c',30,50,0,1,'');break;
 case'manifold':add('in',0,44,-1,0,'');for(let i=0;i<4;i++)add('o'+(i+1),24+30*i,0,0,-1,'');add('o5',150,44,1,0,'');break;
 case'gauge':add('p',32,0,0,-1,'');break;

 case'throttle':if(c.props.rot){add('a',38,0,0,-1,'');add('b',38,100,0,1,'')}else{add('a',0,38,-1,0,'');add('b',100,38,1,0,'')}break;
 case'or':case'and':add('i1',0,44,-1,0,'');add('i2',80,44,1,0,'');add('out',40,0,0,-1,'2');break;
 case'union':add('a',0,15,-1,0,'');add('b',60,15,1,0,'');break;
 case'elbow':add('a',0,15,-1,0,'');add('b',30,50,0,1,'');break;
 case'cross':add('a',0,30,-1,0,'');add('b',60,30,1,0,'');add('c',30,0,0,-1,'');add('d',30,60,0,1,'');break;

function ppos(c,n){const p=portsOf(c)[n];return p?{x:c.x+p.x,y:c.y+p.y,dx:p.dx,dy:p.dy}:null}
function findPort(key){const[i,n]=key.split(':');const c=comps.find(x=>x.id==i);return c?ppos(c,n):null}

function addComp(type,x,y,props,id){
 const d=DEFS[type],c={id:id||('c'+(++seq)),type,x,y,props:Object.assign(d.props(),props||{}),pos:0,slide:0,s:0,lat:{}};
 const m=/^c(\d+)$/.exec(c.id);if(m)seq=Math.max(seq,+m[1]);

 comps.forEach(c=>{if(isSup(c))P.add(netOf[c.id+':out']);if(c.type=='valve')['3','5'].forEach(n=>{const k=netOf[c.id+':'+n];if(k!=null)E.add(k)});if(c.type=='silencer'||c.type=='qex')E.add(netOf[c.id+':'+(c.type=='qex'?'out':'p')])});
 let ch=true,it=0;const ad=(S,n)=>{if(n!=null&&!S.has(n)){S.add(n);ch=true}};
 while(ch&&it++<80){ch=false;L.forEach(l=>{
  if(l.t=='bi'){if(P.has(l.a))ad(P,l.b);if(P.has(l.b))ad(P,l.a)}
  else if(l.t=='frl'||l.t=='dp'){if(P.has(l.a))ad(P,l.b)}
  else if(l.t=='or'){if(P.has(l.a)||P.has(l.b))ad(P,l.o)}
  else if(l.t=='and'){if(P.has(l.a)&&P.has(l.b))ad(P,l.o)}})}
 ch=true;it=0;
 while(ch&&it++<80){ch=false;L.forEach(l=>{
  if(l.t=='bi'){if(E.has(l.a))ad(E,l.b);if(E.has(l.b))ad(E,l.a)}
  else if(l.t=='frl'){if(E.has(l.b))ad(E,l.a)}
  else if(l.t=='or'||l.t=='and'){if(E.has(l.o)){ad(E,l.a);ad(E,l.b)}}})}
 return{P,E}}
